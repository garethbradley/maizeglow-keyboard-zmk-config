# KEYBOARD NAME
CONFIG_ZMK_KEYBOARD_NAME="MaizeGlow"

# INCREASE TRANSMISSION STRENGTH.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# NO WPM WIDGET
#CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# RGB UNDERGLOW
CONFIG_ZMK_RGB_UNDERGLOW=y
# Use the STRIP config specific to the LEDs you're using
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2
# Cap brightness: 21 LEDs at full white can draw ~1A from the battery
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
# Turn LEDs (and their power) off when idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# ...but on USB power, dim to 25% instead of turning off
CONFIG_ZMK_RGB_UNDERGLOW_IDLE_USB_DIM=25
# Disconnect the LED data line while LED power is off (stops standby flicker)
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER_PARK_DATA=y
# Per-key RGB: layer maps (settings/rgb_layers.keymap) drawn over the current effect
CONFIG_EXPERIMENTAL_RGB_LAYER=y
CONFIG_ZMK_RGB_UNDERGLOW_LAYER_OVERLAY=y
# After an RGB key, show the plain effect for 5s before the layer colours return
CONFIG_ZMK_RGB_UNDERGLOW_LAYER_OVERLAY_PREVIEW_MS=5000
# Keep the two halves' animations in phase
CONFIG_ZMK_RGB_UNDERGLOW_SYNC_ANIMATION=y

# DEBUG
CONFIG_ZMK_USB_LOGGING=n

# SLEEP
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=10800000

# NICE!VIEW CONFIG
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y

# ZMK STUDIO
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n